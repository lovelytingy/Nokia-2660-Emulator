[workspace]
members = [
    "crates/n2660-core",
    "crates/n2660-cli",
    "crates/n2660-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["N2660Emu Developers"]
edition = "2021"
license = "MIT"
repository = "https://github.com/lovelytingy/Nokia-2660-Emulator"

[workspace.dependencies]
unicorn-engine = "2.1.5"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
