[package]
name = "n2660-tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware utilities and image packagers for Nokia 2660 Flip"

[dependencies]
n2660-core = { path = "../n2660-core" }
clap = { workspace = true }
byteorder = { workspace = true }
capstone = "0.14.0"

[[bin]]
name = "mksprd_img"
path = "src/bin/mksprd_img.rs"

[[bin]]
name = "pac_extractor"
path = "src/bin/pac_extractor.rs"

[[bin]]
name = "atags"
path = "src/bin/atags.rs"

[[bin]]
name = "bsl_engine"
path = "src/bin/bsl_engine.rs"

[[bin]]
name = "disasm"
path = "src/bin/disasm.rs"
